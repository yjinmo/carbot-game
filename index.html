<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>카봇 놀이 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: one fixed 4:3 game stage sized to the window; every scene is a layer inside it, sized in cqw so it scales from tablet to desktop. */
:root{
  --sky:#8fd3ff;
  --sky-deep:#3d8ee0;
  --grass:#6cc24a;
  --road:#474c5c;
  --ink:#1d2340;
  --paper:#fffaf0;
  --sun:#ffc93c;
  --hot:#ff5a3c;
  --night:#1b1f4a;
  --font-display:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
.photo{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-user-drag:none;background:#fff;border-radius:1.2cqw;border:.4cqw solid var(--ink);box-sizing:border-box}
#combine-real{position:absolute;left:50%;top:12cqw;width:30cqw;transform:translateX(-50%) scale(0);opacity:0;transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#combine-real.on{transform:translateX(-50%) scale(1);opacity:1}
#combine-real .photo{height:34cqw;width:auto;max-width:60cqw;object-fit:contain}
#combine-real,#win .robot,#title .hero,#intro .big,#clear .big{display:flex;justify-content:center}
#combine .robot.gone{opacity:0;transition:opacity .3s}
.team .slot img.photo{height:5cqw;width:auto;max-width:8.6cqw;border-width:.2cqw;border-radius:.6cqw}
#hud .team .slot img.photo{height:4cqw;max-width:6cqw}
#combine .row .photo{height:14cqw;width:auto;max-width:15cqw;margin-inline:auto}
#intro .big .photo,#clear .big .photo{height:24cqw;width:auto;max-width:44cqw;object-fit:contain}
#villain .photo,#boss .robot .photo{max-height:26cqw;width:auto;margin-inline:auto}
#title .hero .photo,#win .robot .photo{height:26cqw;width:auto;max-width:44cqw;object-fit:contain}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;
  padding-inline:16px;padding-block:16px;
  background:linear-gradient(#bfe6ff,#e8f6ff);
  color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#game{
  position:relative;
  width:min(100%, calc((100dvh - 32px) * 4 / 3), 1100px);
  aspect-ratio:4/3;max-width:100%;
  container-type:inline-size;
  border-radius:18px;overflow:hidden;
  background:var(--sky);
  box-shadow:0 10px 0 #2a5d9a33, 0 20px 40px #1d234033;
  outline:4px solid var(--ink);
}
@media (pointer:coarse){
  #game{width:min(100%, calc((100dvh - 32px - 150px) * 4 / 3), 1100px)}
}
.scene{position:absolute;inset:0;overflow:hidden}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.key{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;padding:0 .2em;border-radius:.3em;background:var(--paper);border:.12em solid var(--ink);box-shadow:0 .14em 0 var(--ink);font-family:var(--font-body);line-height:1}

/* ---------- title ---------- */
#title{background:radial-gradient(circle at 50% 120%, var(--sun) 0 28%, transparent 28.2%), linear-gradient(var(--sky-deep),var(--sky));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;text-align:center}
#title .logo{font-size:9cqw;color:var(--paper);-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;line-height:1.05;filter:drop-shadow(0 .8cqw 0 var(--ink))}
#title .logo span{color:var(--sun)}
#title .hero{width:22cqw;animation:bob 2s ease-in-out infinite}
#title p{font-size:3.4cqw;margin:0}
#title small{font-size:2.2cqw;opacity:.75}
@keyframes bob{50%{transform:translateY(-1.2cqw)}}

/* ---------- select ---------- */
#select{background:linear-gradient(var(--sky),#d7f1ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw}
#select h2{font-size:6cqw}
.cards{display:flex;gap:3cqw}
.card{width:22cqw;padding-block:3cqw;border-radius:3cqw;background:var(--paper);border:.6cqw solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:1cqw;transition:transform .2s;box-shadow:0 1cqw 0 var(--ink)}
.card .ico{font-family:var(--font-display);font-size:8cqw;line-height:1;color:var(--hot)}
.card .nm{font-size:3.6cqw}
.card .st{font-size:2.2cqw;opacity:.7}
.card.off{filter:grayscale(1);opacity:.55}
.card.sel{transform:translateY(-1.5cqw) scale(1.08);outline:1cqw solid var(--sun);outline-offset:.4cqw}
#select .help{font-size:3cqw}

/* ---------- intro ---------- */
#intro{background:conic-gradient(from 0deg at 50% 45%, #ffe27a 0 10deg, #ffd23f 10deg 20deg) ,var(--sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center}
#intro .big{width:34cqw;animation:zoomin .7s cubic-bezier(.2,1.6,.4,1) both}
#intro h1{font-size:8cqw;color:var(--paper);-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill}
#intro .job{font-size:3.2cqw}
#intro .how{font-size:2.8cqw;background:var(--paper);border:.4cqw solid var(--ink);border-radius:2cqw;padding:1cqw 2.4cqw}
@keyframes zoomin{from{transform:scale(0) rotate(-200deg)}}
.team{display:flex;gap:1.2cqw}
.team .slot{width:9cqw;height:5.6cqw;border-radius:1cqw;display:grid;place-items:center;background:#ffffff66;border:.3cqw dashed var(--ink)}
.team .slot svg,.team .slot img{width:8cqw}
.team .slot.empty svg,.team .slot.empty img{filter:grayscale(1) brightness(1.4);opacity:.35}
.team .slot.got{border-style:solid;background:var(--paper)}

/* ---------- play ---------- */
#play{background:linear-gradient(var(--sky) 0 30cqw, var(--grass) 30cqw)}
#hud{position:absolute;top:1cqw;left:2cqw;right:2cqw;height:6cqw;display:flex;justify-content:space-between;align-items:center}
#hud .team .slot{width:6.4cqw;height:4.4cqw}
#hud .team .slot svg,#hud .team .slot img{width:5.8cqw}
#stars{font-size:3.6cqw;background:var(--paper);border:.35cqw solid var(--ink);border-radius:3cqw;padding:.3cqw 2cqw;font-variant-numeric:tabular-nums}
#qnum{font-size:2.6cqw;background:var(--ink);color:var(--paper);border-radius:3cqw;padding:.4cqw 1.6cqw}
#panel{position:absolute;top:8cqw;left:4cqw;right:4cqw;height:20cqw;background:var(--paper);border:.5cqw solid var(--ink);border-radius:2.5cqw;display:flex;align-items:center;gap:3cqw;padding-inline:3cqw;box-sizing:border-box;box-shadow:0 .8cqw 0 var(--ink)}
#visual{flex:1 1 60%;min-width:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.6cqw;font-size:5.6cqw;line-height:1.1}
#prompt{flex:1 1 40%;min-width:0;font-size:3.6cqw;line-height:1.3}
#prompt small{display:block;font-size:2.2cqw;opacity:.7;margin-top:.6cqw}
.it{position:relative;display:inline-block}
.it b{position:absolute;right:-.6cqw;top:-.8cqw;font-size:2.2cqw;background:var(--hot);color:#fff;border-radius:50%;width:3cqw;height:3cqw;display:grid;place-items:center;font-weight:400}
.plus{font-family:var(--font-display);font-size:5cqw;color:var(--hot);margin-inline:1cqw}
.word{font-family:var(--font-display);font-size:9cqw;color:var(--sky-deep);line-height:1}
.dots{display:flex;gap:.6cqw;flex-wrap:wrap;justify-content:center;width:100%}
.dots i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--hot);display:block}
#road{position:absolute;left:20cqw;width:60cqw;top:30cqw;height:45cqw;background:var(--road);border-inline:1cqw solid var(--sun);box-sizing:content-box;margin-left:-1cqw;overflow:hidden}
.dash{position:absolute;top:0;bottom:0;width:.8cqw;margin-left:-.4cqw;background:repeating-linear-gradient(#fff 0 4cqw, transparent 4cqw 9cqw)}
.bush{position:absolute;top:30cqw;bottom:0;width:16cqw;background:radial-gradient(circle, #4ea83a 0 2.2cqw, transparent 2.4cqw) 0 0/8cqw 12cqw}
#gates{position:absolute;left:0;right:0;top:0;height:11cqw}
.g{position:absolute;top:0;width:15cqw;height:11cqw;background:var(--paper);border:.5cqw solid var(--ink);border-radius:2cqw 2cqw 1cqw 1cqw;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;box-sizing:border-box;transition:transform .25s, opacity .25s;overflow:hidden}
.g::before{content:"";position:absolute;left:0;right:0;top:0;height:1.4cqw;background:repeating-linear-gradient(90deg,var(--ink) 0 1.4cqw,var(--paper) 1.4cqw 2.8cqw)}
.g .num{font-family:var(--font-display);font-size:7cqw;line-height:1;margin-top:1cqw}
.g .grp{font-size:2.7cqw;line-height:1.05;padding:1.6cqw .6cqw .4cqw;text-align:center;word-break:break-all}
.g.tried{opacity:.35}
.g.hit{transform:scale(1.25);background:var(--sun)}
.g.miss{transform:rotate(-8deg) scale(.9)}
#car{position:absolute;bottom:2cqw;width:9cqw;transition:left .18s ease-out}
#car.shake{animation:shake .4s}
#car.boost{filter:drop-shadow(0 2cqw 0 #ffc93c88)}
@keyframes shake{25%{transform:translateX(-1.2cqw) rotate(-8deg)}75%{transform:translateX(1.2cqw) rotate(8deg)}}
#ctl{position:absolute;right:1.6cqw;bottom:1.6cqw;font-size:2.2cqw;background:#fffaf0dd;border-radius:1.4cqw;padding:.8cqw 1.4cqw;display:flex;flex-direction:column;gap:.6cqw;border:.25cqw solid var(--ink)}
#ctl-left{position:absolute;left:1.6cqw;bottom:1.6cqw;font-size:2.2cqw;background:#fffaf0dd;border-radius:1.4cqw;padding:.8cqw 1.4cqw;border:.25cqw solid var(--ink)}
#clear{position:absolute;inset:0;background:#1d2340aa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw}
#clear .big{width:34cqw;animation:spinpop .8s cubic-bezier(.2,1.6,.4,1) both}
#clear h1{font-size:9cqw;color:var(--sun);-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill}
@keyframes spinpop{from{transform:scale(0) rotate(360deg)}}
.pop{position:absolute;font-size:5cqw;pointer-events:none;animation:popup 1s ease-out forwards}
@keyframes popup{to{transform:translateY(-12cqw) scale(1.5);opacity:0}}

/* ---------- combine ---------- */
#combine{background:repeating-conic-gradient(from 0deg at 50% 50%, #26307a 0 12deg, var(--night) 12deg 24deg);display:flex;align-items:center;justify-content:center}
#combine .robot{width:30cqw;position:relative;top:-6cqw}
#combine .shout{position:absolute;top:3cqw;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:6.4cqw;color:var(--sun);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}
#combine .row{position:absolute;bottom:3cqw;left:0;right:0;display:flex;justify-content:center;gap:2cqw}
#combine .row div{width:15cqw;transition:transform .7s cubic-bezier(.5,-.3,.6,1), opacity .7s}
#combine .row div.fly{transform:translate(var(--dx),-38cqw) scale(.2) rotate(540deg);opacity:0}
#combine .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#combine .flash.go{animation:flash .9s ease-out}
@keyframes flash{15%{opacity:1}}
.robot .part{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.2,1.6,.4,1), opacity .3s}
.robot.build .part{transform:scale(0);opacity:0}
.robot.build .part.on{transform:none;opacity:1}

/* ---------- boss ---------- */
#boss{background:linear-gradient(#2c1f5e,#6a3fa0 60%,#3a2a3a 60%, #2a2030)}
#boss .robot{position:absolute;left:5cqw;bottom:19cqw;width:22cqw;transform-origin:bottom center;z-index:2}
#boss .robot .aura{transform-box:fill-box;transform-origin:center;animation:aura 1.6s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.08);opacity:.7}}
#boss .robot.charge{animation:charge .09s linear infinite}
/* 펜타스톰 움직임: 대기(숨쉬기) / 주먹 / 필살기 자세 */
.toon g{transform-box:view-box;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.toon{overflow:visible;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.toon .t-upper{animation:breathe 1.4s ease-in-out infinite}
.toon .t-arml{transform-origin:54px 100px;animation:swayl 1.4s ease-in-out infinite}
.toon .t-armr{transform-origin:206px 98px;animation:swayr 1.4s ease-in-out infinite}
.toon .t-head{transform-origin:130px 104px;animation:nod 2.8s ease-in-out infinite}
.toon .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes breathe{50%{transform:translateY(5px)}}
@keyframes swayl{50%{transform:rotate(6deg)}}
@keyframes swayr{50%{transform:rotate(-6deg)}}
@keyframes nod{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#boss .robot.punch-l .t-arml{animation:none;transform:rotate(115deg) translateY(-8px)}
#boss .robot.punch-r .t-armr{animation:none;transform:rotate(-115deg) translateY(-8px)}
#boss .robot.punch-l .toon,#boss .robot.punch-r .toon{transform:translateX(1.5cqw) rotate(4deg)}
#boss .robot.pose-beam .toon{transform:translateX(3cqw) rotate(8deg)}
#boss .robot.pose-beam .t-arml{animation:none;transform:rotate(95deg)}
#boss .robot.pose-beam .t-armr{animation:none;transform:rotate(-95deg)}
#boss .robot.pose-missile .t-arml{animation:none;transform:rotate(165deg)}
#boss .robot.pose-missile .t-armr{animation:none;transform:rotate(-165deg)}
#boss .robot.pose-missile .toon{animation:recoil .13s ease-out infinite}
@keyframes recoil{50%{transform:translateX(-1cqw) scaleY(.96)}}
#boss .robot.pose-sword .toon{animation:leap 1.3s cubic-bezier(.3,0,.4,1) forwards}
#boss .robot.pose-sword .t-armr{animation:swing 1.3s cubic-bezier(.6,-.3,.3,1.2) forwards}
#boss .robot.pose-sword .t-arml{animation:none;transform:rotate(40deg)}
@keyframes leap{0%{transform:none}30%{transform:translateY(-9cqw) rotate(-6deg)}55%{transform:translateY(-9cqw) translateX(2cqw) rotate(-6deg)}75%{transform:translateX(4cqw) rotate(10deg) scaleY(.9)}100%{transform:translateX(3cqw) rotate(6deg)}}
@keyframes swing{0%{transform:none}45%{transform:rotate(-175deg)}70%,100%{transform:rotate(-70deg)}}
#boss .robot.charge .aura{animation:aurabig .25s ease-in-out infinite}
#boss .robot.charge svg{filter:drop-shadow(0 0 1.5cqw #ffe066) drop-shadow(0 0 3cqw #ff9a00)}
@keyframes charge{25%{transform:translate(-.3cqw,.2cqw)}75%{transform:translate(.3cqw,-.2cqw)}}
@keyframes aurabig{0%,100%{transform:scale(1.3)}50%{transform:scale(1.55)}}
#boss .robot.wiggle{animation:wig .12s}
@keyframes wig{50%{transform:translateY(-.6cqw) rotate(-1.5deg)}}
#villain{position:absolute;right:6cqw;bottom:19cqw;width:22cqw;z-index:2;animation:hover 2.4s ease-in-out infinite}
#villain.hurt{animation:hurt .7s}
#villain.down{animation:down 1.6s ease-in forwards}
@keyframes hover{50%{transform:translateY(-1.6cqw)}}
@keyframes hurt{20%,60%{transform:translateX(2cqw);filter:brightness(3)}40%,80%{transform:translateX(-2cqw)}}
@keyframes down{to{transform:rotate(720deg) scale(0);opacity:0}}
#bossname{position:absolute;right:4cqw;top:3cqw;color:var(--paper);font-size:3cqw;text-align:right}
#hearts{font-size:4.4cqw;letter-spacing:.4cqw}
#hearts .lost{filter:grayscale(1);opacity:.3}
#bossmsg{position:absolute;left:4cqw;top:3cqw;max-width:52cqw;font-size:3.2cqw;color:var(--ink);background:var(--paper);border:.4cqw solid var(--ink);border-radius:2cqw;padding:1.2cqw 2cqw}
#fxdark{position:absolute;inset:0;background:radial-gradient(circle at 20% 55%, #ffb00055, #0a0620ee 60%);opacity:0;pointer-events:none;transition:opacity .25s;z-index:1}
#fxdark.on{opacity:1}
#speed{position:absolute;inset:-20%;opacity:0;pointer-events:none;z-index:1;background:repeating-conic-gradient(from 0deg at 23% 55%, #ffffff55 0 2deg, transparent 2deg 9deg)}
#speed.on{opacity:1;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(25deg)}}
#beam{position:absolute;left:20cqw;bottom:28cqw;width:62cqw;height:11cqw;transform-origin:left center;transform:scaleX(0);opacity:0;z-index:3;pointer-events:none}
#beam i{position:absolute;left:0;right:0;top:50%;border-radius:6cqw;transform:translateY(-50%)}
#beam .b1{height:100%;background:linear-gradient(90deg,#ff3cac,#ff7a00 30%,#ffe066 60%,#ff3cac);filter:blur(1cqw);opacity:.85}
#beam .b2{height:62%;background:repeating-linear-gradient(90deg,#ffe066 0 4cqw,#ffffff 4cqw 6cqw);animation:stripes .25s linear infinite}
#beam .b3{height:28%;background:#fff;box-shadow:0 0 2cqw #fff}
@keyframes stripes{to{background-position:6cqw 0}}
#beam.go{animation:beam 1.3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes beam{0%{opacity:1;transform:scaleX(0) scaleY(.4)}15%{opacity:1;transform:scaleX(1) scaleY(1.2)}30%,75%{opacity:1;transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1) scaleY(1.15)}100%{opacity:0;transform:scaleX(1) scaleY(0)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.go{animation:flashw .5s ease-out}
@keyframes flashw{0%{opacity:.95}100%{opacity:0}}
#boss.shake{animation:bshake .5s}
@keyframes bshake{10%,50%,90%{transform:translate(-1.2cqw,.6cqw)}30%,70%{transform:translate(1.2cqw,-.6cqw)}}
.ring{position:absolute;width:6cqw;height:6cqw;margin:-3cqw 0 0 -3cqw;border-radius:50%;border:1.2cqw solid #ffe066;box-shadow:0 0 2cqw #ff7a00;pointer-events:none;z-index:4;animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:scale(7);opacity:0;border-width:.2cqw}}
.spark{position:absolute;font-size:4.4cqw;pointer-events:none;z-index:4;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.4) rotate(200deg);opacity:0}}
.pow{position:absolute;font-family:var(--font-display);font-size:9cqw;color:#fff;-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;text-shadow:0 0 2cqw #ff3cac;pointer-events:none;z-index:5;animation:pow .9s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}30%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.1)}}
.orb{position:absolute;width:1.6cqw;height:1.6cqw;border-radius:50%;background:#fff;box-shadow:0 0 1.5cqw #ffe066,0 0 3cqw #ff9a00;pointer-events:none;z-index:3;animation:orb .6s ease-in forwards}
@keyframes orb{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:.2}}
#special{position:absolute;left:0;right:0;top:12cqw;text-align:center;white-space:nowrap;font-family:var(--font-display);font-size:8cqw;line-height:1;color:var(--sun);-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill;z-index:5;animation:slam .6s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 3cqw #ff7a00, 0 .8cqw 0 var(--ink)}
#special span{display:inline-block;animation:glow .3s ease-in-out infinite alternate}
@keyframes glow{to{color:#fff;transform:scale(1.04)}}
@keyframes slam{0%{transform:scale(4);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.missile{position:absolute;width:11cqw;height:3.8cqw;margin:-1.9cqw 0 0 -5.5cqw;pointer-events:none;z-index:3;animation:missile .55s cubic-bezier(.5,0,.8,.6) forwards}
.missile svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 .6cqw #fff) drop-shadow(0 0 1.4cqw #ff7a00)}

<script>
/*
 * 카봇 놀이 대모험 (숫자 · 한글 · 색깔)
 * 조작은 화살표 키(또는 터치 화살표 버튼)만 씁니다.
 *
 * ── 새 학습(한글, 색깔 등) 추가하는 법 ──────────────────────────
 * MODULES 배열에 아래 모양의 객체를 하나 넣으면 됩니다.
 *   {
 *     id: 'colors', title: '색깔 놀이', icon: '🎨', ready: true,
 *     questionsPerStage: 3,
 *     makeQuestion(stage) {      // stage: 0~4 (에이스, 프론, 스카이, 댄디, 스톰 순서)
 *       return {
 *         say: '빨간색을 찾아 줘!',      // 읽어 줄 말
 *         text: '빨간색은 어디?',        // 화면 글씨
 *         visual: '<span>🎨</span>',     // 문제 그림(HTML)
 *         help: null,                    // 틀렸을 때 바꿔 보여 줄 그림(없으면 null)
 *         hint: '다시 잘 봐!',           // 틀렸을 때 읽어 줄 말
 *         praise: '맞아! 빨간색!',       // 맞혔을 때 읽어 줄 말
 *         choices: ['<span class="num">🔴</span>', ...3개], // 길 3개에 놓일 답
 *         answer: 0                      // choices 중 정답 번호
 *       };
 *     }
 *   }
 * 스테이지 진행, 카봇 모으기, 합체, 보스전은 모든 학습에서 그대로 재사용됩니다.
 * ────────────────────────────────────────────────────────────────
 */

/* ---------- 데이터 ---------- */
const CARBOTS = [
  {id:'ace',   name:'에이스', color:'#e0302a', trim:'#ffd23f', roof:'fire',   job:'119 레스큐 · 필살기 타이어 공격!'},
  {id:'fron',  name:'프론',   color:'#f2f5fa', trim:'#2457c5', roof:'police', job:'112 경찰차 · 춤 잘 추는 친구, 아미고!'},
  {id:'sky',   name:'스카이', color:'#ff7a12', trim:'#2b2b2b', roof:null,     job:'씽씽 해치백 · 예감이 잘 맞아!'},
  {id:'dandy', name:'댄디',   color:'#f4f6fb', trim:'#e63a2e', roof:'amb',    job:'119 구급차 · 힘이 세다, 크릉!'},
  {id:'storm', name:'스톰',   color:'#2c5fcf', trim:'#ffc93c', roof:null,     job:'덤프트럭 · 똑똑한 대장', truck:true},
];

const NATIVE  = ['', '하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열'];
const COUNTER = ['', '한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
const SINO    = ['', '일','이','삼','사','오','육','칠','팔','구','십'];

/* ---------- 도우미 ---------- */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function threeNumbers(ans, lo, hi){
  const set = new Set([ans]);
  while(set.size<3) set.add(rand(lo,hi));
  const nums = shuffle([...set]);
  return {nums, answer: nums.indexOf(ans)};
}
const row = (e,n,start=0,numbered=false) => Array.from({length:n},(_,i)=>`<span class="it">${e}${numbered?`<b>${start+i+1}</b>`:''}</span>`).join('');
const numChoice = n => `<span class="num">${n}</span>`;

/* ---------- 학습 모듈 ---------- */
function countQ(maxN){
  const n = rand(1,maxN), t = pick(THINGS), c = threeNumbers(n, 1, Math.max(4,maxN));
  return {
    say:`${t.s} 몇 개일까?`, text:`${t.s} 몇 개일까?<small>세어 보고 맞는 숫자 길로 가자!</small>`,
    visual: row(t.e,n), help: row(t.e,n,0,true),
    hint:`같이 세어 보자! ${NATIVE.slice(1,n+1).join(', ')}.`,
    praise:`딩동댕! ${t.n} ${COUNTER[n]} 개!`,
    choices: c.nums.map(numChoice), answer: c.answer,
  };
}
function wordQ(){
  const n = rand(1,9), c = threeNumbers(n, 1, 9);
  const dots = `<div class="dots">${'<i></i>'.repeat(n)}</div>`;
  return {
    say:`숫자 ${SINO[n]}! ${NATIVE[n]}! 어디 있을까?`, text:`숫자 ${SINO[n]}, ${NATIVE[n]}!<small>이 숫자를 찾아서 달려!</small>`,
    visual:`<div class="word">${NATIVE[n]}</div>`, help:`<div class="word">${NATIVE[n]}</div>${dots}`,
    hint:`점을 세어 봐! 점이 ${COUNTER[n]} 개야.`,
    praise:`맞아! 숫자 ${SINO[n]}!`,
    choices: c.nums.map(numChoice), answer: c.answer,
  };
}
function mostQ(){
  const t = pick(THINGS), counts = shuffle([1,2,3,4,5]).slice(0,3);
  const max = Math.max(...counts);
  return {
    say:`${t.s} 제일 많은 곳으로 가자!`, text:`${t.s} 제일 많은 곳은?<small>길마다 세어 보고 골라!</small>`,
    visual:`<span style="font-size:8cqw">${t.e}</span>`, help:null,
    hint:'하나씩 세어서 비교해 봐!',
    praise:`맞아! 거기가 ${COUNTER[max]} 개로 제일 많아!`,
    choices: counts.map(n=>`<span class="grp">${t.e.repeat(n)}</span>`), answer: counts.indexOf(max),
  };
}
function addQ(){
  const a = rand(1,3), b = rand(1,5-a), s = a+b, t = pick(THINGS), c = threeNumbers(s, 1, 6);
  return {
    say:`${t.n} ${COUNTER[a]} 개랑 ${COUNTER[b]} 개를 더하면 몇 개일까?`, text:`모두 몇 개일까?<small>합쳐서 세어 봐!</small>`,
    visual:`${row(t.e,a)}<span class="plus">+</span>${row(t.e,b)}`,
    help:`${row(t.e,a,0,true)}<span class="plus">+</span>${row(t.e,b,a,true)}`,
    hint:`모두 합쳐서 세어 봐! ${NATIVE.slice(1,s+1).join(', ')}.`,
    praise:`딩동댕! 모두 ${COUNTER[s]} 개!`,
    choices: c.nums.map(numChoice), answer: c.answer,
  };
}

/* ---------- 한글 놀이 (풍선 받기) ---------- */
const hasBatchim = w => { const c = w.charCodeAt(w.length-1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 !== 0; };
const josa = (w, a, b) => w + (hasBatchim(w) ? a : b);   // josa('당근','은','는') → 당근은 (받침 있으면 a, 없으면 b)
const bags = {};
function draw(key, arr){ if(!bags[key] || !bags[key].length) bags[key] = shuffle(arr); return bags[key].pop(); }
function threeOf(ans, pool){
  const others = shuffle(pool.filter(x=>x!==ans)).slice(0,2);
  const items = shuffle([ans, ...others]);
  return {items, answer: items.indexOf(ans)};
}
const SYL = ['가','나','다','라','마','바','사','아','자','카','타','파','하'];
const SYL_WORD = {가:['🎒','가방'], 나:['🦋','나비'], 다:['🐿️','다람쥐'], 라:['🍜','라면'], 마:['🎤','마이크'], 바:['🍌','바나나'],
  사:['🦁','사자'], 아:['👶','아기'], 자:['🚗','자동차'], 카:['📷','카메라'], 파:['🌊','파도'], 하:['🦛','하마']};
const WORDS = [['🦁','사자'],['🐘','코끼리'],['🐰','토끼'],['🦒','기린'],['🍇','포도'],['🍌','바나나'],['🌳','나무'],['🦆','오리'],
  ['🦊','여우'],['🦛','하마'],['🥛','우유'],['🚂','기차'],['⏰','시계'],['🍕','피자'],['🐳','고래'],['🦋','나비'],['🚗','자동차'],['🐢','거북이']];
const ALL_SYL = [...new Set([...SYL, ...WORDS.flatMap(([,w])=>[...w])])];
const letterChoice = l => `<span class="num">${l}</span>`;
const pic = e => `<span style="font-size:10cqw;line-height:1">${e}</span>`;

function matchLetterQ(){
  const L = draw('match', SYL), c = threeOf(L, SYL);
  return {
    say:`${L}! 똑같은 글자 풍선을 받아!`, text:`똑같은 글자를 찾아!<small>모양을 잘 보고 풍선을 받아!</small>`,
    visual:`<div class="word">${L}</div>`, help:null,
    hint:`${L}! 모양을 잘 봐!`, praise:`딩동댕! ${L}!`,
    choices: c.items.map(letterChoice), answer: c.answer,
  };
}
function listenLetterQ(){
  const L = draw('listen', Object.keys(SYL_WORD)), [e,w] = SYL_WORD[L], c = threeOf(L, SYL);
  return {
    say:`${L}! ${w}의 ${L}! ${L}를 찾아!`, text:`잘 듣고 글자를 찾아!<small>모르겠으면 ↓ 를 눌러 다시 들어!</small>`,
    visual:`${pic(e)}<div class="word">🔊</div>`, help:`${pic(e)}<div class="word"><span class="hl">${w[0]}</span>${w.slice(1)}</div>`,
    hint:`${w}의 ${L}! 첫 글자를 봐!`, praise:`맞아! ${w}의 ${L}!`,
    choices: c.items.map(letterChoice), answer: c.answer,
  };
}
function blankQ(first){
  const [e,w] = draw(first?'first':'blank', WORDS), sy = [...w];
  const i = first ? 0 : rand(1, sy.length-1), L = sy[i];
  const c = threeOf(L, ALL_SYL.filter(x=>!sy.includes(x)).concat(L));
  const shown = sy.map((x,k)=>k===i?'<span class="blank">?</span>':x).join('');
  return {
    say: first ? `${w}! ${w}의 첫 글자는 뭘까?` : `${w}! 빈칸에 들어갈 글자는 뭘까?`,
    text:`${first?'첫 글자':'빈칸 글자'}를 찾아!<small>그림 이름을 생각해 봐!</small>`,
    visual:`${pic(e)}<div class="word">${shown}</div>`,
    help:`${pic(e)}<div class="word">${sy.map((x,k)=>k===i?`<span class="hl">${x}</span>`:x).join('')}</div>`,
    hint:`${w}! ${L}! 잘 들어 봐!`, praise:`딩동댕! ${w}!`,
    choices: c.items.map(letterChoice), answer: c.answer,
  };
}
function readWordQ(){
  const [e,w] = draw('read', WORDS), c = threeOf(w, WORDS.map(x=>x[1]));
  return {
    say:'이건 뭘까? 맞는 이름 풍선을 받아!', text:`이건 뭘까?<small>이름이 쓰인 풍선을 받아!</small>`,
    visual: pic(e), help:`${pic(e)}<div class="word"><span class="hl">${w[0]}</span>${'?'.repeat(w.length-1)}</div>`,
    hint:`첫 글자는 ${w[0]}! ${w[0]}로 시작하는 풍선을 찾아!`, praise:`맞아! ${w}!`,
    choices: c.items.map(x=>`<span class="wd">${x}</span>`), answer: c.answer,
  };
}

  {n:'빨강', a:'빨간색', c:'#e53935', things:[['🍎','사과'],['🍓','딸기'],['🚒','소방차']]},
  {n:'주황', a:'주황색', c:'#fb8c00', things:[['🥕','당근'],['🍊','귤']]},
  {n:'노랑', a:'노란색', c:'#fdd835', things:[['🍌','바나나'],['🐥','병아리']]},
  {n:'초록', a:'초록색', c:'#43a047', things:[['🐸','개구리'],['🥦','브로콜리'],['🍀','네잎클로버']]},
  {n:'파랑', a:'파란색', c:'#1e88e5', things:[['🐳','고래'],['💧','물방울']]},
  {n:'보라', a:'보라색', c:'#8e24aa', things:[['🍇','포도'],['🍆','가지']]},
  {n:'분홍', a:'분홍색', c:'#f06292', things:[['🐷','돼지'],['🌸','벚꽃']]},

const COLOR = Object.fromEntries(COLORS.map(x=>[x.n,x]));
const swatch = (x, sm='') => `<span class="swatch ${sm}" style="--c:${x.c}"></span>`;
const flag = x => `<span class="flag" style="--c:${x.c}"><i></i></span>`;
function colorChoices(ans, pool=COLORS){
  const c = threeOf(ans, pool);
  return {choices: c.items.map(flag), answer: c.answer};
}
function matchColorQ(){
  const basic = ['빨강','노랑','파랑','초록'].map(n=>COLOR[n]), x = draw('cmatch', basic);
  return {
    say:`${x.a}! 똑같은 색깔 깃발로 가자!`, text:`똑같은 색을 찾아!<small>깃발 사이로 슝 지나가자!</small>`,
    visual: swatch(x), help:null,
    hint:`${x.a}! 똑같은 색을 잘 찾아 봐!`, praise:`딩동댕! ${x.a}!`,
    ...colorChoices(x, basic),
  };
}
function nameColorQ(){
  const x = draw('cname', COLORS);
  return {
    say:`${x.a}을 찾아! ${x.a} 깃발로 가자!`, text:`<b style="font-size:5cqw">${x.a}</b>은 어디?<small>잘 듣고 깃발을 찾아!</small>`,
    visual:`<div class="word">🎨</div>`, help: swatch(x),
    hint:`${x.a}은 이런 색이야!`, praise:`맞아! ${x.a}!`,
    ...colorChoices(x),
  };
}
function thingColorQ(){
  const x = draw('cthing', COLORS), [e,t] = pick(x.things);
  return {
    say:`${josa(t,'은','는')} 무슨 색일까?`, text:`${josa(t,'은','는')} 무슨 색?<small>맞는 색깔 깃발로 가자!</small>`,
    visual: pic(e), help:`${pic(e)}${swatch(x,'sm')}`,
    hint:`${josa(t,'은','는')} ${x.a}이야!`, praise:`딩동댕! ${josa(t,'은','는')} ${x.a}!`,
    ...colorChoices(x),
  };
}
function carbotColorQ(){
  const cb = draw('ccar', SAFARI.filter(c=>c.colorName)), x = COLOR[cb.colorName];
  return {
    say:`${cb.name} 카봇은 무슨 색일까?`, text:`${cb.name} 카봇은 무슨 색?<small>카봇 색깔 깃발로 가자!</small>`,
    visual: carSVG(cb), help:`${carSVG(cb)}${swatch(x,'sm')}`,
    hint:`${josa(cb.name,'은','는')} ${x.a}이야!`, praise:`맞아! ${josa(cb.name,'은','는')} ${x.a}!`,
    ...colorChoices(x),
  };
}
function mixColorQ(){
  const [p,q,r] = draw('cmix', [['빨강','노랑','주황'],['파랑','노랑','초록'],['빨강','파랑','보라']]).map(n=>COLOR[n]);
  return {
    say:`${p.a}이랑 ${q.a}을 섞으면 무슨 색이 될까?`, text:`두 색을 섞으면?<small>물감 마법! 새 색깔 깃발로 가자!</small>`,
    visual:`${swatch(p,'sm')}<span class="plus">+</span>${swatch(q,'sm')}<span class="plus">=</span><span class="word">?</span>`,
    help:`${swatch(p,'sm')}<span class="plus">+</span>${swatch(q,'sm')}<span class="plus">=</span>${swatch(r,'sm')}`,
    hint:`${p.a}이랑 ${q.a}을 섞으면 ${r.a}이 돼!`, praise:`딩동댕! ${r.a}!`,
    ...colorChoices(r, COLORS.filter(x=>x!==p && x!==q)),
  };
}

 * style: 놀이 화면 모양 — road(도로 달리기) / balloon(떨어지는 풍선 받기) / ski(스키 타고 깃발 지나가기)
 * how: 첫 카봇 소개 때 읽어 줄 조작 설명, ctl: 화면 오른쪽 아래 조작 안내

 */

      return [matchLetterQ, listenLetterQ, ()=>blankQ(Math.random()<.5), readWordQ][stage]();   // 마이티가드는 4대라 4판
    } },
  { id:'colors', title:'색깔 놀이', icon:'🎨', ready:true, questionsPerStage:3, style:'ski', team:'safari',

    makeQuestion(stage){
      return [matchColorQ, nameColorQ, thingColorQ, carbotColorQ, mixColorQ][stage]();
    } },

function photoImg(id, cls=''){
  const list = PHOTOS[id] || [];
  if(!list.length) return FALLBACK[id]();
  return `<img src="${list[0]}" data-id="${id}" data-i="0" alt="" class="photo ${cls}" referrerpolicy="no-referrer" draggable="false" onerror="photoFail(this)">`;
}
function photoFail(img){
  const id = img.dataset.id, i = +img.dataset.i + 1, list = PHOTOS[id];
  if(i < list.length){ img.dataset.i = i; img.src = list[i]; return; }
  const t = document.createElement('template'); t.innerHTML = FALLBACK[id]().trim();
  img.replaceWith(t.content.firstElementChild);
}

function shade(hex, p){
  const n = parseInt(hex.slice(1),16), ch = [n>>16, n>>8&255, n&255];
  const f = v => Math.round(p<0 ? v*(1+p) : v+(255-v)*p);
  return '#' + ch.map(v=>f(v).toString(16).padStart(2,'0')).join('');
}

/* ---------- 소리 ---------- */
let ac = null;
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac = null; } }
  if(ac && ac.state==='suspended') ac.resume().catch(()=>{});
  return ac;
}
function tone(f, dur, type='square', vol=.07, when=0, slide){
  const a = audio(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX = {
  move:  ()=>tone(660,.06,'triangle',.06),
  right: ()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.05,i*.09)),
  wrong: ()=>tone(320,.3,'sawtooth',.045,0,170),
  tick:  p=>tone(260+p*7,.05,'square',.04),
  beam:  ()=>{tone(180,1.1,'sawtooth',.07,0,1400);tone(90,1.1,'square',.05,0,700);},
  boom:  ()=>tone(120,.6,'sawtooth',.09,0,40),
  join:  ()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'triangle',.06,i*.07)),
  fanfare:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.05,i*.16)),
};

/* ---------- 목소리 ---------- */
let koVoice = null;
function loadVoices(){
  try{ const vs = speechSynthesis.getVoices(); koVoice = vs.find(v=>/^ko/i.test(v.lang)) || null; }catch(e){}
}
try{ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
function say(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = .95; u.pitch = 1.15;
    if(koVoice) u.voice = koVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* play */

function updateStars(){ $('stars').textContent = `⭐ ${state.stars}`; }
function placeCar(){ $('car').style.left = (state.lane*20 + (mod().style==='balloon' ? 2.5 : 5.5)) + 'cqw'; }
function nextQuestion(){
  const q = mod().makeQuestion(state.stage);
  state.q = q;
  state.items = q.choices.map((html,i)=>({html, ok:i===q.answer, tried:false}));
  $('visual').innerHTML = q.visual;
  $('prompt').innerHTML = q.text;
  $('qnum').textContent = `${crew()[state.stage].name} 미션 ${state.qi+1} / ${mod().questionsPerStage}`;
  say(q.say);

}
function spawnGates(delay){
  state.gateOn = false; state.gateT = 0;
  const g = $('gates'); g.style.top = gateTravel()[0] + 'cqw';
  const hues = shuffle(['#ff6b8b','#ffa62b','#4fc3f7','#9ccc65','#b388ff','#ff8a65']);
  g.innerHTML = state.items.map((it,i)=>`<div class="g ${it.tried?'tried':''}" style="left:${i*20+2.5}cqw;--bc:${hues[i]}">${it.html}</div>`).join('');

}
function resolveGate(){
  state.gateOn = false;
  const it = state.items[state.lane], el = $('gates').children[state.lane];
  if(it.ok){
    el.classList.add('hit'); SFX.right(); say(state.q.praise);
    state.stars++; updateStars(); popStar();
    state.qi++;
    later(()=>{ state.qi < mod().questionsPerStage ? nextQuestion() : stageClear(); }, 2400);
  }else{
    it.tried = true; el.classList.add('miss'); SFX.wrong();
    if(mod().style==='balloon'){ tone(900,.08,'square',.06,0,200); popAt('펑!', state.lane*20 + 26, 50); }

    if(state.q.help) $('visual').innerHTML = state.q.help;
    say(`괜찮아! ${state.q.hint}`);
    later(()=>{
      // 틀린 답은 흐리게 남겨 두고, 길 순서를 섞어서 다시 보낸다
      state.items = shuffle(state.items);

}

  state.inputAt = performance.now() + 2000;
}

/* ---------- 입력: 화살표만 ---------- */
function press(d, repeat){
  audio();
  if(performance.now() < state.inputAt) return;
  const sc = state.scene;
  if(sc==='title'){ goto('select'); return; }
  if(sc==='select'){
    if(repeat) return;
    if(d==='left' || d==='right'){
      state.moduleIdx = (state.moduleIdx + (d==='left'?-1:1) + MODULES.length) % MODULES.length;
      drawCards(); SFX.move(); say(`${mod().title}! ${team().name} 팀!`);
    }else if(d==='up'){
      if(!mod().ready){ SFX.wrong(); say('이건 곧 나와요!'); return; }
      state.stage = 0; state.team = 0; state.stars = 0;
      goto('intro');
    }
    return;
  }
  if(sc==='intro'){ if(!repeat) goto('play'); return; }
  if(sc==='play'){
    if(d==='up'){ held.up = true; return; }
    if(d==='down'){ if(!repeat && state.q) say(state.q.say); return; }
    if(!$('clear').hidden) return;
    const nl = state.lane + (d==='left'?-1:1);
    if(nl>=0 && nl<=2){ state.lane = nl; placeCar(); SFX.move(); }
    return;
  }
  if(sc==='boss'){ if(!repeat && !state.locked) mash(d); return; }
  if(sc==='win'){ if(d==='up' && !repeat) goto('select'); return; }
}
function release(d){ if(d==='up') held.up = false; }

const KEYS = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};
addEventListener('keydown', e=>{ const d = KEYS[e.key]; if(!d) return; e.preventDefault(); press(d, e.repeat); });
addEventListener('keyup', e=>{ const d = KEYS[e.key]; if(d) release(d); });
document.querySelectorAll('#pad button').forEach(b=>{
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); press(d,false); });
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t, ()=>release(d)));
});
// 제목 화면은 화면을 눌러도 시작 (키보드 포커스도 함께 잡힘)
$('title').addEventListener('pointerdown', ()=>{ audio(); if(state.scene==='title') goto('select'); });

/* ---------- 게임 루프 ---------- */
const GATE_TIME = 6.5;   // 문이 차까지 오는 시간(초)
const GATE_TRAVEL = {road:[0,17], ski:[0,17], balloon:[-22,20]};  // 문(풍선)이 출발하는 높이와 차에 닿는 높이 (cqw)
const gateTravel = () => GATE_TRAVEL[mod().style] || GATE_TRAVEL.road;
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(state.scene==='play'){
    const fast = held.up && state.gateOn;
    const spd = state.gateOn ? (fast ? 3 : 1) : .4;
    state.roadY = (state.roadY + dt*spd*18) % 9;
    document.querySelectorAll('#road .dash').forEach(el=>el.style.backgroundPositionY = state.roadY + 'cqw');
    document.querySelectorAll('#play .bush').forEach(el=>el.style.backgroundPositionY = (state.roadY*4/3) + 'cqw');
    $('car').classList.toggle('boost', fast);
    if(state.gateOn){
      state.gateT += dt*spd/GATE_TIME;
      const [from,to] = gateTravel();
      $('gates').style.top = (from + Math.min(1,state.gateT)*(to-from)) + 'cqw';
      if(state.gateT >= 1) resolveGate();
    }
  }
  if(state.scene==='boss' && !state.locked && state.power>0){
    state.power = Math.max(0, state.power - dt*9);
    drawGauge();
  }
  requestAnimationFrame(loop);
}

$('title-robot').innerHTML = robotSVG();
requestAnimationFrame(loop);
</script>
